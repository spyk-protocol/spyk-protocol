[toolchain]
anchor_version = "0.32.1"
solana_version = "2.1.0"

[features]
resolution = true
skip-lint = false

[programs.localnet]
noir_verifier = "9HA5gERa9gHxvAhr3ndpwQ9zBPkF8WP2fVjLbXZink9t"

[programs.devnet]
noir_verifier = "9HA5gERa9gHxvAhr3ndpwQ9zBPkF8WP2fVjLbXZink9t"

[registry]
